<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <title>Adivina el número</title>
  </head>

  <body>
    <main class="contenedor">
      <h1>🎲 Adivina el número</h1>

      <p>
        Estoy pensando en un número entre 1 y 100.
      </p>

      <form id="formulario">
        <label for="numero">Ingresa tu número:</label>

        <input
          type="number"
          id="numero"
          min="1"
          max="100"
          required
        >

        <button type="submit">Adivinar</button>
      </form>

      <p id="mensaje" class="mensaje">
        Escribe un número para comenzar.
      </p>

      <p>
        Intentos: <span id="intentos">0</span>
      </p>

      <p>
        Mejor puntuación:
        <span id="mejorPuntuacion">Sin registro</span>
      </p>

      <button id="reiniciar" type="button">
        Reiniciar juego
      </button>

      <section>
        <h2>Números intentados</h2>
        <ul id="historial"></ul>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
