<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Personajes con Fetch y Axios</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="contenedor">
    <h1>Personajes de Rick and Morty</h1>

    <p>
      Consulta los mismos datos usando Fetch o Axios.
    </p>

    <section class="botones">
      <button id="btn-fetch" type="button">
        Obtener con Fetch
      </button>

      <button id="btn-axios" type="button">
        Obtener con Axios
      </button>
    </section>

    <p id="mensaje" aria-live="polite"></p>

    <section
      id="data-container"
      class="personajes"
      aria-live="polite"
    ></section>
  </main>

  <!-- Axios cargado desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <script src="script.js"></script>
</body>
</html>
