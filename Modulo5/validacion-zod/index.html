<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registro con Zod</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="contenedor">
    <h1>Crear cuenta</h1>

    <form id="formularioRegistro" novalidate>
      <div class="campo">
        <label for="nombre">Nombre:</label>

        <input
          type="text"
          id="nombre"
          name="nombre"
          autocomplete="name"
        >

        <small id="errorNombre" class="error"></small>
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico:</label>

        <input
          type="email"
          id="correo"
          name="correo"
          autocomplete="email"
        >

        <small id="errorCorreo" class="error"></small>
      </div>

      <div class="campo">
        <label for="contrasena">Contraseña:</label>

        <input
          type="password"
          id="contrasena"
          name="contrasena"
          autocomplete="new-password"
        >

        <small>
          Debe tener al menos 8 caracteres, una mayúscula y un número.
        </small>

        <small id="errorContrasena" class="error"></small>
      </div>

      <button type="submit">Registrarme</button>
    </form>

    <p id="mensajeExito" class="exito" aria-live="polite"></p>
  </main>

  <script
    type="module"
    src="script.js"
  ></script>
</body>
</html>
